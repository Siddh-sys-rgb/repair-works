name: Repair workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install isolated dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Validate dependency compatibility
        run: python -m pip check
      - name: Exercise workflow, security boundaries and concurrent writes
        run: python -m pytest --cov=workshop --cov-report=term-missing --cov-fail-under=90
